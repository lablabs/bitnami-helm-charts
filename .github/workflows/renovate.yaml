name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: 0 4 * * *

permissions:
  contents: read

jobs:
  call-workflow:
    name: lara-tools
    uses: lablabs/lara-tools/.github/workflows/renovate.yml@dbc87871dad2a26b40dc5d9598533fc4a75eba4b # v1.8.1
    secrets:
      renovate-app-id: ${{ secrets.LARA_RENOVATE_APP_ID }}
      renovate-app-private-key: ${{ secrets.LARA_RENOVATE_APP_PRIVATE_KEY }}
